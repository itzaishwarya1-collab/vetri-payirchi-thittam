<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ title }} - ComicCraft AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/style.css') }}"
    >

</head>


<body>

    <div class="page">

        <header class="header">

            <div class="logo">
                🎨 ComicCraft AI
            </div>

            <a
                href="/"
                class="back-button"
            >
                ← Create Another
            </a>

        </header>


        <main class="success-container">

            <div class="success-card">

                <div class="success-icon">
                    🎉
                </div>

                <h1>
                    Comic Exported Successfully!
                </h1>

                <p>
                    Your ComicCraft comic has been
                    successfully exported as a PDF.
                </p>

                <a
                    href="/"
                    class="generate-button"
                >
                    ✨ Create Another Comic
                </a>

            </div>

        </main>


        <footer class="footer">

            <p>
                ComicCraft AI Comic Story Creator
            </p>

        </footer>

    </div>

</body>

</html>
